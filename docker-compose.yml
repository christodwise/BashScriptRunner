version: '3.8'

services:
  bashrunner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass the API key from environment or .env file
        GEMINI_API_KEY: ${GEMINI_API_KEY}
    image: bashrunner:latest
    container_name: bashrunner-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      # Environment variables for the application
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bashrunner-network
    labels:
      - "com.bashrunner.description=BashRunner AI-Powered Script Execution Simulator"
      - "com.bashrunner.version=1.0.0"

networks:
  bashrunner-network:
    driver: bridge

# Usage:
# 1. Create a .env file with: GEMINI_API_KEY=your_key_here
# 2. Run: docker-compose up -d
# 3. Access: http://localhost:3000
# 4. View logs: docker-compose logs -f
# 5. Stop: docker-compose down
